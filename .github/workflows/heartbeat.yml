name: AI Sosmed Heartbeat Agent

on:
  schedule:
    # Berjalan otomatis setiap jam 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Mengizinkan pemicu manual dari Dashboard GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Pastikan ffmpeg tersedia
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Eksekusi AI Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 'true' = kirim media ke Telegram (tanpa Instagram Graph API).
          # Ubah ke 'false' hanya setelah IG_USER_ID dan IG_ACCESS_TOKEN terisi valid.
          DRY_RUN: 'true'
          PREVIEW_FORMAT: 'video'
          CONTENT_NICHE: ${{ vars.CONTENT_NICHE || 'mlbb' }}
          TIKTOK_ENABLED: ${{ secrets.TIKTOK_ENABLED || 'false' }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
          TIKTOK_CHUNK_SIZE_MB: ${{ secrets.TIKTOK_CHUNK_SIZE_MB || '10' }}
          MLBB_YOUTUBE_QUERY: ${{ vars.MLBB_YOUTUBE_QUERY || 'mobile legends indonesia' }}
          MLBB_SEED_TOPICS: ${{ vars.MLBB_SEED_TOPICS }}
        run: python main.py